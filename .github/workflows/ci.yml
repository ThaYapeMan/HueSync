name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          xargs sudo apt-get install -y --no-install-recommends < scripts/native-build-packages.txt

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22 (matches installer)
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Unit tests
        run: npm test
        working-directory: web

      - name: Build (TypeScript + Vite)
        run: npm run build
        working-directory: web

      - name: Check bundle matches source
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- src/huesync/webui/)" ]]; then
            echo ""
            echo "ERROR: The committed bundle in src/huesync/webui/ does not match"
            echo "a fresh build of the current web/src/ source."
            echo "Run: cd web && npm run build, then commit src/huesync/webui/."
            exit 1
          fi
