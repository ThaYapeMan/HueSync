[project]
name = "huesync"
version = "0.2.0"
description = "Beat/spectrum-reactive Philips Hue Entertainment sync for Lyrion Music Server, via a virtual squeezelite player and cava."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jaap van Vliet" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "hue-entertainment>=0.1.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
huesync = "huesync.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/huesync"]
# webui/ (built React app) and _commit.py live under src/huesync/ and are included automatically.

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
