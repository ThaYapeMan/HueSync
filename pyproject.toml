[project]
name = "huesync"
version = "0.2.0"
description = "Spectrum-reactive Philips Hue Entertainment lighting driven by LMS or AirPlay 2."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jaap van Vliet" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "hue-entertainment>=0.1.2",
    "numpy>=1.26",
    "soxr>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]
calibration = [
    "soundfile>=0.12",
]

[project.scripts]
huesync = "huesync.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/huesync"]
# _libcavacore.so is generated by hatch_build.py and not tracked by git.
# Listing it under artifacts forces Hatchling to include it in the wheel even
# though it would otherwise be excluded as an untracked generated file.
artifacts = [
    "src/huesync/cavacore/_libcavacore.so",
]
# webui/ (built React app) and _commit.py live under src/huesync/ and are included automatically.

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
